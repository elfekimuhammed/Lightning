name: Android dependency probe

on:
  workflow_dispatch:
    inputs:
      wheel_run:
        description: Run id of "Android native wheel experiment" whose arm64 wheels to install
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  arm64-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: [crypto-only, full]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/download-artifact@v4
        if: inputs.wheel_run != ''
        with:
          run-id: ${{ inputs.wheel_run }}
          github-token: ${{ github.token }}
          pattern: android-*-wheel
          merge-multiple: true
          path: android/wheels
      - name: Build arm64 dependency probe
        working-directory: android
        env:
          WHEEL_RUN: ${{ inputs.wheel_run }}
        run: |
          ls wheels 2>/dev/null || true
          gradle --no-daemon :app:assembleDebug -PprobeMode=${{ matrix.mode }} ${WHEEL_RUN:+-PwheelDir=$PWD/wheels}
      - uses: actions/upload-artifact@v4
        if: success() && matrix.mode == 'full'
        with:
          name: lightning-android-dependency-probe
          path: android/app/build/outputs/apk/debug/app-debug.apk
