# Exploratory task 04a build. No wheel from this job is used in a release until
# its source, link dependencies, Android runtime and 16 KB support are verified.
name: Android native wheel experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: cryptography
            version: 50.0.2
          - package: sqlcipher3
            version: 0.6.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned wheel builder
        run: python -m pip install 'cibuildwheel==4.2.1'
      - name: Download pinned source distribution
        env:
          PROBE_PACKAGE: ${{ matrix.package }}
          PROBE_VERSION: ${{ matrix.version }}
        run: |
          mkdir -p /tmp/lightning-android-source
          python -m pip download --no-deps --no-binary=:all: \
            --dest /tmp/lightning-android-source "${PROBE_PACKAGE}==${PROBE_VERSION}"
          tar -xzf /tmp/lightning-android-source/*.tar.gz -C /tmp/lightning-android-source
      - name: Supply SQLCipher Conan Android API setting for this experiment
        if: matrix.package == 'sqlcipher3'
        env:
          PROBE_VERSION: ${{ matrix.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          source = Path('/tmp/lightning-android-source') / f"sqlcipher3-{os.environ['PROBE_VERSION']}" / 'setup.py'
          original = source.read_text(encoding='iso-8859-1')
          needle = "    settings.append('arch=%s' % arch)"
          assert original.count(needle) == 1, 'upstream setup changed; review the Conan patch'
          patched = original.replace(needle, needle + "\n    settings.append('os.api_level=24')")
          source.write_text(patched, encoding='iso-8859-1')
          PY
      - name: Cross-build CPython 3.13 arm64 wheel
        env:
          CIBW_BUILD: 'cp313-*'
          CIBW_ARCHS_ANDROID: arm64_v8a
          CIBW_TEST_SKIP: '*'
          # cibuildwheel accepts Bash command substitution in its per-build
          # environment. Locate the target Python headers, not host headers.
          CIBW_ENVIRONMENT_ANDROID: 'CFLAGS="$CFLAGS -I$(dirname $(find /tmp/cibw-run-*/cp313-android_arm64_v8a/python -name Python.h -print -quit))"'
          ANDROID_API_LEVEL: '24'
          PROBE_PACKAGE: ${{ matrix.package }}
          PROBE_VERSION: ${{ matrix.version }}
        run: >-
          python -m cibuildwheel --platform android --archs arm64_v8a
          --output-dir /tmp/lightning-android-wheels
          "/tmp/lightning-android-source/${PROBE_PACKAGE}-${PROBE_VERSION}"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-${{ matrix.package }}-wheel
          path: /tmp/lightning-android-wheels/*.whl
