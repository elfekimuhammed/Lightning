<section class="card"><h2 id="app-popup-title">Liquidation scenario</h2><p class="muted">Choose the share of investment holdings to include in this planning estimate. Cash and deposits stay at full value.</p><form method="post" action="/birdview/settings" class="stack" data-popup-autosave><label>Investment value included (%)<input type="number" name="factor" min="0" max="100" step="0.1" value="{{ factor }}" required></label><span class="inline-save-status" role="status" aria-live="polite"></span><div class="actions"><button type="button" class="btn" data-popup-close>Close</button></div><input type="hidden" name="__session" value="{{ request.state.session_token|default('') }}"></form></section>
