<form class="card stack" method="post" action="/budget/settings/full"><input type="hidden" name="return_to" value="{{ budget_return_to }}"><h2>Budget</h2><label><input type="checkbox" name="carryover" value="1" {{ 'checked' if carryover }}> Carry unused room and overspending into tracked categories</label><label>Effective from month<input type="text" name="carryover_month" value="{{ carryover_month }}" placeholder="yyyy-mm" pattern="\d{4}-\d{2}" title="Month, yyyy-mm" class="month-input" required></label><label>Average over the last completed months<select name="income_months"><option value="3" {{ 'selected' if income_months=='3' }}>3 months</option><option value="6" {{ 'selected' if income_months=='6' }}>6 months</option></select></label><fieldset><legend>Income categories to include</legend>{% for category in income_categories %}<label><input type="checkbox" name="income_category" value="{{ category.id }}" {{ 'checked' if category.id in selected_income }}> {{ category.name }}</label>{% endfor %}</fieldset><label>Set average monthly income by hand (optional)<input name="manual_income" inputmode="decimal" value="{{ manual_income }}" placeholder="Use recorded income"></label><label>Tracking suggestion threshold (%)<input name="suggestion_percent" type="number" min="0" max="100" step="0.1" value="{{ suggestion_percent }}"></label><label>Fixed monthly spending suggestion (EGP)<input name="suggestion_fixed" inputmode="decimal" value="{{ suggestion_fixed }}"></label><label>Monthly spending ceiling (%)<input name="ceiling_percent" type="number" min="0" max="300" step="1" value="{{ ceiling_percent }}"></label><fieldset><legend>One-off categories excluded from estimates</legend>{% for category in expense_categories %}<label><input type="checkbox" name="exclusion_category" value="{{ category.id }}" {{ 'checked' if category.id in excluded_categories }}> {{ category.name }}</label>{% endfor %}</fieldset><button class="btn primary">Save budget settings</button><input type="hidden" name="__session" value="{{ request.state.session_token|default('') }}"></form>
