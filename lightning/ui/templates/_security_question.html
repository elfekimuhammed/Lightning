<div class="field"><label for="security-question">Security question</label><input id="security-question" name="question" type="text" value="{{ question }}" list="suggested-questions" required autocomplete="off" maxlength="200"><small>Type your own, or pick one.</small></div>
<datalist id="suggested-questions">{% for item in questions %}<option value="{{ item }}">{% endfor %}</datalist>
<div class="field"><label for="security-answer">Answer</label><input id="security-answer" name="answer" type="text" required autocomplete="off" spellcheck="false" maxlength="200"><small>Capitals, spaces and Arabic letter forms (أ إ آ ا, ة ه, ى ي) do not matter.</small></div>
